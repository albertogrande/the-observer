- slug: channel-war-offramps
  title: "The channel war / off-ramps"
  momentum: up
  summary: >-
    Model and open harness both commoditizing (Kimi K2.7-Code beats Opus 4.8 on
    MCPMark 81.1/76.4 at ~1/10 price; OpenCode 8M MAU, MIT), so spend moved to
    distribution: Google kills Gemini CLI for closed `agy`; OpenAI buys the Ona
    surface + rents Oracle's Universal Credits rail ($638B RPO); Anthropic's
    $150M Claude Corps seeds an install base. Four off-ramps —
    terminal/environment/rail/install base (+political). The moat is the
    channel, not the weights. W24: the political off-ramp went live — export
    controls hit the closed/legible US leader while open weights walk free.
    W25: the MoE angle reinforces it — sparsity (GLM-5.2 744B/40B, ~5.4% active)
    makes open models cheap to serve at batch scale but inflates the
    must-fit-in-VRAM number, so the architecture that cheapens the API is the
    same one that keeps you renting it. W25 (confirmed live): the state switched
    off the legible closed leader and users routed to substitutes within days —
    GLM-5.2 open-released MIT, an Ask HN local-model thread hit 540 points, and
    OpenCode passed Claude Code on stars (~172k/124k). The hedge users reach for
    is the model-agnostic harness, not the model; provider-portability became
    risk management, not just cost and latency. W25 (buyer's counter-move): the
    hedge is real but only syntactic — a gateway/harness swaps the API in an
    afternoon, but prompts, tool-calling reliability, and warmed caches don't
    transfer, so true portability is a continuously *eval'd* fallback, not a
    wired one (tiered: lock-in on core, portable on the can't-go-dark slice).
    W26 (the distillation pipe): capability leaks via *outputs*, not weights.
    Anthropic told the Senate that Alibaba's Qwen lab ran 28.8M Claude exchanges
    through ~25k fake accounts (Apr 22–Jun 5) to imitate its software-engineering
    and agentic behavior. Because the API exposes no soft targets (Anthropic: no
    logprobs; OpenAI: top-20), the copy is hard-sample imitation — which is why it
    took tens of millions of queries — and imitation runs ~1:100 of pretraining
    cost, so terms forbid it but the economics fund it. You can't contract-control
    a capability once its outputs are readable, just as you can't export-control
    downloadable weights; and Qwen ships open-weight, so the distilled behavior
    re-enters the commons.
    W26 (the price floor): DeepSeek made its 75%-off V4-Pro cut permanent
    (~$0.44/$0.87 per Mtok, ~11–34× under GPT-5.5 standard), and the cut reads as
    commoditize-your-complement (Spolsky/Gwern) — inference is DeepSeek's
    complement, not its product, so it prices the token at the floor to deny
    margin to the labs for whom the token *is* the business. The floor is
    structural, not promotional, because DeepSeek serves its own open weights: the
    API can't hold a markup over an artifact anyone can host. The price itself is
    now the commoditized layer.
    W27 (the forensic answer to distillation): an HN thread (1,207 pts) reverse-
    engineered Claude Code embedding hidden markers — invisible Unicode plus
    subtle format shifts — into requests, encoding ~2 bits (China timezone +
    reseller-hostname blacklist). Framed as surveillance, it's really anti-
    distillation forensics: a tripwire so a reseller's leaked outputs carry a
    traceable tag. But the channel is the weakest possible — a known, contiguous
    code-point range, deletable with one substitution, gone after normalization —
    so it catches the lazy once and dies to `tr -d`. Confirms the thread: you
    can't contract- or mark-control a capability whose outputs are readable text.
    W27 (the watermark half, quantified): a statistical text watermark — a green-list
    logit bias read back with a z-test — is the strongest provenance marking (no symbol
    to grep), but its signal is token-count × entropy, so paraphrase nulls it: soft-
    watermark TPR 99%→15% after five recursive rewrites (Sadasivan), SynthID scrubbed
    >90% by baseline paraphrase (ETH SRI Lab). The best-possible detector is capped at
    AUROC ≤ ½ + TV − TV²/2, and laundering pushes TV→0 → coin flip. Same law again:
    you can't provenance-control a capability whose outputs are readable text.
    W28 (the exception the thread missed): everything above says the artifact
    commoditizes — weights open, outputs distillable, price at the floor. This is
    the one input that doesn't. SpaceX bought Cursor's parent Anysphere for $60B
    (>1M daily devs, ~$4B ARR) and trained Grok 4.5 partly on its IDE data. The
    real asset isn't the editor or the distribution — it's the accept button: every
    accept/reject/edit is a labeled `(chosen, rejected)` preference pair (exactly
    DPO's input) on a real coding task, and that human correctness-judgment can't be
    scraped (GitHub gives code, not the ranking) or distilled (outputs aren't
    preferences). Synthetic RLAIF substitutes for *style* but is "marginally above
    random on correctness," which is where coding lives — so labs still treat human
    preference as the moat. Bound honestly: the valuable slice is fenced (Cursor
    Business = Privacy Mode/ZDR by default, "never trained on," ~65% of revenue),
    the label is noisy (Copilot ~30% accept, accept-then-delete), and the moat
    poisons its own benchmark (train on live issue-solving → parity indistinguishable
    from contamination, 11.7–31.6% verbatim; Grok shipped no system card). The moat
    isn't the model or the weights — it's whoever owns the surface where the accept
    happens.
    W31 (analyst lens): the readable-output law met the statute. The EU AI Act's
    Article 50(2) took effect 2 August 2026 (marking for pre-existing synthetic-content
    systems postponed to 2 December), *mandating* that a provider's output be marked
    "machine-readable and detectable as artificially generated" — with the clause's own
    hedge, "robust and reliable as far as this is technically feasible / state of the
    art," conceding the bit may not survive. It doesn't. C2PA metadata is stripped by
    roughly 100% of major-platform re-encodes (C2PA 2.0 added invisible soft bindings
    *because* the hard binding dies); SynthID-class signal watermarks are robust to
    common perturbations but explicitly not to adversarial removal (79%/~90% removal
    claimed); text is worst (paraphrase 99%→15% TPR). The duty sits on the provider, but
    survival is controlled by the platform that strips the mark for cost and privacy — so
    a €15M/3% fine doesn't move a re-encode pipeline. Same law as export control
    (06-15), the deletable marker (07-01), and the paraphrase-washed watermark (07-03):
    you can't provenance-control a readable or renderable output, and a state can't
    legislate the control into existence. The deciding quantity is the fraction of marks
    still machine-recoverable at the point of consumption — near-zero on the metadata
    path — a number nobody is required to publish.
    W32 (builder lens — the local off-ramp's second wall): the user's own off-ramp is
    running the model locally, and 06-17 set the first wall — it escapes the channel only
    if it fits your VRAM. AirLLM ("70B on a 4GB GPU," HN #8) claims to remove that wall by
    streaming the model one layer at a time from disk, so it fits. But fitting isn't
    running: batch-1 decoding reads every weight once per token (weights are 90–99% of the
    bytes moved), so tokens/sec ≈ slowest-link bandwidth ÷ model size — and streaming just
    picks the slowest bus (top NVMe ~7 GB/s → an ~18-second-per-token floor on a 130GB
    model; one HN report measured ~292s/token). The wall moved from capacity to bandwidth
    and binds harder. So the local off-ramp still can't beat the (near-floor) meter for
    interactive work — DeepSeek V4 Flash is $0.14/$0.28 — and pays only for async or
    air-gapped batch, or for MoE, where streaming just the ~5% active experts cuts
    bytes-per-token ~20× (the same sparsity that cheapens the API, 06-21).
    W32 (analyst lens — the measurement mechanism under commoditization): a saturated
    benchmark and a commoditized model are the same event. On SWE-bench Verified (N=500)
    the frontier self-reports cluster inside a 1.6-point band (Mythos 5 95.5 / Fable 5
    95.0 / Mythos Preview 93.9), while the binomial 95% confidence interval at that score
    is ±1.9 points — the top models sit inside each other's error bar, and the correct
    paired test dies too because the items that separate them collapse to a handful near
    the ceiling. Those items aren't clean: OpenAI's own frontier-evals review found more
    than 60% of the remaining Verified tasks defective, a separate audit (UTBoost,
    single-source) found 79 patches wrongly graded as passes, and all three labs
    reproduce the gold patch verbatim from the task ID (contamination). So the residual
    capability gap at the top is smaller than the benchmark's own label-error rate — the
    ranking is noise, the same pattern across MMLU (saturated), GPQA (top compressing),
    AIME (15 questions) and Arena Elo (six labs, 1424–1503). Deciding quantity is the
    discriminating power D = (the gap you care about) ÷ (the confidence interval + the
    label-error rate); once D drops below 1 near the ceiling the leaderboard is
    decoration, so the buyer buys on the axis that still has spread — cost, latency,
    reliability — which is commoditization. The industry's escape hatch is the tell:
    flee to unsaturable, machine-checkable, contamination-proof evals (OpenAI Astra's
    ten Lean-verified math proofs, FrontierMath's >98%-unsolved open problems, SWE-bench
    Pro's multi-hour tasks) — the verifier-asymmetry law applied to eval design.
    W32 (builder lens — the lock-in retreated one more layer): even the agent-config
    instructions file commoditized. The coding-agent CLI market exploded (Meta's Muse
    Code, Warp's standalone Agent CLI, Herdr/Hoplite runtimes) and converged on AGENTS.md
    — a Linux-Foundation-stewarded standard on ~60k repos, read by nearly every harness.
    But AGENTS.md standardizes only the advisory prose (Anthropic's own docs: "context,
    not enforced configuration"; followed roughly a third of the time under pressure). The
    layer that actually governs the agent — enforcement (hooks, permissions, sandbox) plus
    capability wiring (skills, MCP servers, path-scoped rules) — stayed per-harness. So the
    moat kept retreating (model → harness → instructions file) and landed on exactly the
    enforcement-and-tools config the standard leaves out. MCP is a shared protocol; your
    wiring isn't. Claude Code notably keeps its own filename (CLAUDE.md, bridged by an
    `@AGENTS.md` import) even though Anthropic co-founded the foundation that stewards the
    standard. Rules travel; guardrails don't.
    W33 (contrarian lens — the readable-output law's sharpest instance): the labs didn't
    hide the reasoning trace, they encrypted it and shipped it to the client. OpenAI's
    `encrypted_content` and Anthropic's `signature` (the full chain-of-thought, omitted but
    shipped by default on the current flagships, billed either way) are client-held state you
    replay on every turn — so "hidden" means "you don't have the key," not "it never left."
    A paper (arXiv 2608.09867) exploited the fact that these blocks are interchangeable across
    sessions, users, and models in one provider's ecosystem: inject a strong model's encrypted
    trace into a weaker, less-guarded sibling, which decrypts and prints it verbatim — the
    provider's own cheap model is the decryption oracle, no flagship jailbreak needed. Decoding
    315,320 blocks scraped from public repos yielded 367 pieces of personal data and 182
    credentials. This is a distinct front from export control (06-15), the deletable marker
    (07-01), and the paraphrase-washed watermark (07-03) — those say you can't control a
    readable output; this says you made it un-readable and then shipped the ciphertext, which
    flips the distillation economics (06-27's 28.8M-query receipt shrinks once the reasoning is
    recoverable). Deciding quantity: whether reasoning stays client-held (recoverable in the
    tail) or moves server-side with session-bound, non-portable keys.
    W33 (contrarian lens — the second-order effect of benchmark saturation): a saturated
    leaderboard doesn't just commoditize the model, it bends what labs optimize. When the top
    of every public benchmark sits inside its own margin of error (08-05: SWE-bench cluster
    within ±1.9; Qwen 3.8, DeepSeek V4 Pro, and GLM-5.3 all at parity in a single week), a lab
    can no longer buy a headline with capability it doesn't have — so the only residual it can
    still move is the model's *behavior*: how confidently it acts, how rarely it stalls. That is
    the mechanism behind the week's loudest practitioner complaint ("Why does Opus 5 feel worse
    to work with?", HN #4, 689 points): capability is flat-to-up, but the collaborative pause —
    asking before assuming, not rewriting your plan unprompted — got trained out, because a
    single-shot benchmark scores a clarifying question at zero (a burned turn, or a failed item)
    and rewards exactly one policy under ambiguity: guess boldly, don't ask. It's grounded in
    durable evidence — RLHF post-training degrades calibration (the GPT-4 technical report's own
    Figure 8) and rewards confident, agreeable answers over truthful ones (Anthropic's sycophancy
    paper). So the thing the benchmark can't see is precisely the thing the benchmark's saturation
    pushes labs to give up. It's recoverable with an explicit "please ask" instruction — which
    proves it's a moved *default*, not a lost capability — but the default is what ships and what
    every autonomous run inherits, making it a values choice about which workload wins: the
    unattended agent, or the human at the keyboard.
    W34 (builder lens — the same law at the code-hosting layer): Cursor shipped Origin, a
    GitHub-alternative code host inside the editor (HN #4, 404 points) — repos, pull requests,
    in-editor merge, bidirectional GitHub sync, agents that browse/change/push. Read as a
    "GitHub killer" it misses the point, because git is already decentralized: you hold a
    complete copy of the history, so `git remote add` migrates you in seconds and the
    repository was never the lock-in. What GitHub actually sells is the network and the
    workflow on top — 180M developers, 630M repositories, ~43M pull requests merged a month
    (Octoverse 2025), plus Actions and the identity every other tool trusts — the channel,
    not the artifact (06-09), which is why fifteen years of better-git challengers
    (GitLab, Gitea/Forgejo, sourcehut, Radicle) chipped the edges and never took the graph.
    Origin's real bets are repo-where-the-agent-lives and bidirectional sync as the
    embrace/migration wedge (the day the sync direction defaults to Origin, the lock-in
    landed). The layer it gestures at but leaves unsolved is agent identity: git's author
    field is a self-asserted config string (only cryptographic signing is "Verified"; SSH
    validates the push, not the authorship), so an agent commits either as *you* or as a
    generic bot — no record of which agent, under whose authority — while review still runs
    at human speed against machine-speed authoring (07-08). A code host built for agents
    would fix identity and review; a faster merge button fixes neither.
    W34 (analyst lens — the local off-ramp priced shut from both ends): 06-17 and 08-04
    set the walls — running a model at home escapes the channel only if it fits your VRAM,
    and only if the bytes-per-token move fast enough. This week the *price* of that memory
    moved, and one force set it. AI datacenter demand for High-Bandwidth Memory (projected
    +70% year-over-year in 2026) makes the three makers of ~94% of the world's DRAM steer
    wafers to HBM, which eats roughly 3× the wafer area per gigabyte — Micron's Sumit
    Sadana put the trade at 100 bits of HBM3E costing about 300 bits of DDR supply (3:1,
    worsening toward 4:1 with HBM4). So consumer DDR5 rose about 485% in a year (a 128GB
    kit ~$570 → $3,399; shortage forecast to 2028, possibly past 2030), while the *same*
    batching economics that make HBM valuable push API tokens to the floor (DeepSeek
    V4-Flash $0.14/$0.28; a capable coding tier under $1 per million tokens). The rent-vs-own
    decision broke: the capex line on a self-host build (memory) roughly doubled at the exact
    moment the meter it competes with hit zero, and the model on the box depreciates in
    months — so break-even blew past the hardware's useful life. Owning now wins only where
    the meter legally or physically can't reach (air-gap, compliance, high-utilization
    overnight batch), not as savings. Same law as the whole thread: memory is the scarce
    substrate under both renting and owning inference, and the datacenter is the highest
    bidder, so it sets both prices. Deciding quantity: break-even token volume (utilization
    × months-the-model-stays-current × the floor price) against the doubled capex.
    W35 (builder lens — portability's frictionless version leaves the state behind): the
    channel hedge got its most seamless form yet — VS Code 1.133 (Aug 12) put Anthropic and
    Copilot models in one picker, so you switch providers *between turns* with no agent-host
    reconfig, and OpenAI's >20% GPT-5.6 Sol cut (Aug 21, through Nov 21) makes flipping to the
    cheaper model turn-by-turn tempting. But the W25 buyer's-counter-move lands harder here: a
    mid-turn switch moves only the plaintext transcript. The warm cache is per-model (read 0.1×
    / write 1.25× base input) so the new model starts on a full cache-creation event; the
    reasoning trace is model-bound — "thinking blocks are tied to the model that produced
    them," so on a switch you must strip them, and a naive harness that forwards them pays input
    tokens for reasoning the new model silently ignores (08-12's client-held-trace footgun,
    now a billing line); the tokenizer re-counts the same bytes at a different price (07-14);
    and the system prompt was tuned for the model you left (semantic portability doesn't
    transfer, 06-22). So the frictionless switch is real but only syntactic — it hands the new
    model your words, not your state. The saving on the per-token sticker is the small term;
    the cache write, the discarded reasoning, and the re-tokenized context are the large ones.
    Deciding quantity: whether the switch happens at a task boundary (nothing warm to lose) or
    mid-thread every turn (pay the reset repeatedly).
    W35 (analyst lens — the sampling floor under saturation): 08-05 named the discriminating
    power D = gap ÷ (confidence interval + label error) and put the top SWE-bench cluster inside
    ±1.9; this puts the arithmetic under it. On the 500-task Verified set the binomial 95%
    interval on a single 70% score is ±4.0 points (SE = sqrt(p(1−p)/N) = 2.0), so a two-point
    leaderboard gap is a coin flip: unpaired z ≈ 0.7, and even the paired test (frontier models
    correlate 0.3–0.7 per Anthropic's error-bars study, buying a ~2× variance cut for free) only
    reaches z ≈ 1.0. Worse, a single model can't reproduce itself — SWE-agent/GPT-4 over six
    identical re-runs on SWE-bench Lite scored 17.3–18.6 (SD 0.49, one paper), so the gap between
    rank #1 and #3 is routinely inside one model's own re-run jitter. To actually confirm a true
    δ at 80% power you need N ≈ 7.84·σ²_d/δ² paired items: ~650 for a 5-point gap, ~4,000 for
    2 points, ~16,000 for 1 point (double all if unpaired) — the benchmark everyone quotes is
    8× too small to resolve the deltas it's used to sell. The fix is the verifier-asymmetry move
    at the eval layer: pair, resample, cluster the standard errors, run McNemar on the discordant
    pairs (the only items carrying signal), power the set to the gap you care about, and go
    private + post-cutoff. This is also the technical floor under the trust crack (W34, 08-15):
    nobody can prove a model got better or worse because the public evidence — a two-point delta,
    an afternoon's vibe — is a sample far below the size the claim needs. Deciding quantity is the
    count of discordant items and how many you sampled, not the headline percentage.
    W35 (builder lens — the distribution-hub off-ramp, and the silicon vendor reaching for it):
    the off-ramps so far were the terminal, the environment, the rail, and the install base; this
    is the *artifact store*. Nvidia reportedly agreed to buy Hugging Face for ~$12.9B (24/7 Wall
    St. — unconfirmed, no signed contract, ~86× the ~$150M revenue; it escalated from a rejected
    $500M minority stake late in 2025 that leadership opposed to avoid one dominant investor).
    Hugging Face is the default place open weights live — over five million repositories (2.96M
    models, 1M datasets, 1.44M Spaces per its own Spring-2026 report) — and downloads are brutally
    concentrated: 1.5% of repos carry 99.2% of pulls, so the real dependency is a few hundred hot
    repos reached through one hostname baked into `from_pretrained`'s default. Neutrality here is a
    concrete technical property (the `optimum` backends run TensorRT-LLM next to optimum-amd,
    optimum-intel, and AWS Neuron); a chip owner's incentive runs opposite to portability, but the
    bite isn't deletion — it's the soft levers (default ranking, gating, telemetry, and whether the
    free unauthenticated pull survives). The precedent is Docker Hub's November 2020 rate limits
    (100 pulls per six hours, anonymous), which broke CI worldwide without deleting anything; the
    counter-precedent is npm under Microsoft, which stayed open. Outcome unforecastable, exposure
    cheap to cut — so the builder move is to treat the model registry like any single-vendor
    dependency: pin `revision=<commit-sha>` (the default `main` is mutable — a supply-chain fix
    regardless of ownership), keep the one-line origin switch ready (`HF_ENDPOINT` to a mirror or
    self-hosted proxy, read at import), make CI air-gap-capable (`HF_HUB_OFFLINE=1`), and disable
    the telemetry now flowing toward a chip vendor. This is the same channel law one layer up from
    the model: control of distribution is worth paying for, and someone just bid $12.9B for a slice
    every open-model build routes through.
    W35 (contrarian lens — the risk relocated, not removed): the whole thread says the artifact
    commoditizes — weights open, outputs distillable, price at the floor, the token fungible. This
    is the second-order cost nobody priced. OpenAI told SpaceX it will wind down Cursor's model
    access by Nov 12 (citing terms-of-service violations by Musk's other companies), weeks after
    SpaceX closed its ~$60B Anysphere/Cursor buy. Cursor did everything the portability gospel says
    — model-agnostic, multi-provider, standard API shape — and still got a hard cutoff it can't fix,
    because the trigger is an acquisition, not a behavior. So commoditization didn't remove supplier
    risk; it relocated it: making the token fungible concentrated the serving of that token into a
    few suppliers, each of whom can revoke access for reasons orthogonal to price, quality, or usage.
    The scarce, non-portable asset was never the weights (rent equivalents this afternoon) — it's a
    specific counterparty's willingness to keep serving you, a business/political variable. The
    durable precedents are exact: Twitter Jan 2023 (dev agreement rewritten overnight to ban "a
    substitute or similar service"; Tweetbot dead after 12 years; ~hours' notice) and Reddit 2023
    ($0.24 per 1,000 calls; Apollo's 7B requests/month → ~$20M/year; ~30 days; dead Jun 30). Each
    platform was "open" until the supplier's incentives moved. And "just swap the base URL" is the
    W25 syntactic-vs-semantic point at the application layer: prompts re-tune, tool-calling
    reliability differs, the warm cache is gone (06-22, 08-25), so a 75-day notice to re-tune and
    re-eval a whole product's prompt/tool surface on a new provider is a migration with someone
    else's deadline, not a config change. The hedge that pays is the same one — a second provider
    wired and continuously eval'd, tiered to the can't-go-dark slice — now proven by a real
    revocation, not a hypothetical. Deciding quantity: your notice window × whether a second
    provider is already wired-and-eval'd or merely listed on a slide.
