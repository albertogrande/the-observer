- slug: machine-buyer
  title: "The machine buyer / agent-native economy"
  momentum: up
  summary: >-
    The web is growing a native payment layer for machine buyers. HTTP 402
    ("Payment Required," reserved since 1997) has been revived: Cloudflare's
    Monetization Gateway plus AWS/CloudFront now charge agents per request
    (page/API/dataset/MCP tool) via x402 (Coinbase, open-sourced May 2025;
    ~$600M annualized by Mar 2026, zero protocol fees; the Foundation moved to
    the Linux Foundation with Google, Visa, Stripe, AWS, Circle, Anthropic).
    Thesis: micropayments died 25 years on Shirky/Szabo "mental transaction
    costs" — humans hate valuing a penny — but agents have none, so the friction
    that killed the human case is exactly what the machine buyer lacks: a new
    market, not a retry. Two stacks — machine-buys-for-itself (x402) vs
    agent-buys-for-human (ACP/AP2 card rails). Composes with docs-as-distribution:
    be callable (MCP) AND payable per call.
  tension: >-
    Tiny volume; stablecoin, regulatory, and CDN-lock-in friction; it could
    stall in the Flattr gap. The tell that it's real is a wallet shipped inside
    an agent runtime. W28 gave the dark-mirror version: a ransomware agent swept
    hosts for provider API keys and crypto wallets — the credentials are the
    fuel and the payment rail at once. The discovery half has its own dark
    mirror (09-05): when the agent is the buyer, being *cited* by its answer
    engine is the new front page — and that supply chain is more gameable than
    ranked search, not less. Three sites published 215,128 machine-built "best
    software" pages titled "Facts & Grounding Page" and won Perplexity citations
    (a vendor blog out-cited Gartner) because the winning signal is surface
    authority markers a ranker can't separate from real authority, and the
    one-answer format strips the provenance a reader would check.
  issues:
    - { label: "Dive · Your Next Customer Is an Agent With a Wallet", link: "/reports/deep-dives/2026-07-06-agent-with-a-wallet.html" }
    - { label: "Dive · The Agent Reading Your Docs Won't Scroll", link: "/reports/deep-dives/2026-07-04-docs-for-agents-distribution.html" }
    - { label: "Dive · AI Answer Engines Are More Gameable Than Search, Not Less", link: "/reports/deep-dives/2026-09-05-answer-engines-more-gameable.html" }

- slug: verifier-asymmetry
  title: "What AI is good at / the verifier asymmetry"
  momentum: up
  summary: >-
    The shape of what large models can and can't do, roughly independent of
    scale: a model is strong exactly where success has a short, cheap, faithful
    certificate you can *run*, and weak where it doesn't. A counterexample checks
    in one pass; a proof of a ∀-statement has no single witness — the P-vs-NP
    asymmetry showing up in the prompt. Opened 07-24: AI out-counterexamples
    mathematicians but not out-proves them (Fable's Jacobian-conjecture
    counterexample checkable on a napkin per Tao; AlphaProof minutes-to-disprove
    vs up-to-three-days-to-prove). The pattern under the headlines is
    model + verifier + search (FunSearch, AlphaEvolve) — a test suite IS a
    verifier, so agents win on test-passing code and lose on "right
    architecture?/secure?" where no cheap faithful verifier exists; best-of-N
    pays only where the check is cheap; the human is verifier-of-last-resort and
    deskills; a runnable verifier is over-optimizable (Goodhart). Deciding
    quantity = verifier fidelity × verifier cost.
    W31 (contrarian lens): the law shows up in cryptanalysis, corroborated by a
    domain expert. Anthropic's Jul 28 results (Claude Mythos preview) sort by
    runnability — the confident ones are executable key recoveries (HAWK-256
    2^64→2^38 via a newly found lattice automorphism; LEA reduced to 13 rounds,
    ~2^30 plaintexts in under an hour; Serpent reduced to 6 rounds, full recovery
    — each a one-pass certificate), and the soft one is the un-runnable 7-round
    AES attack (2^105 chosen plaintexts, 2^89 operations) where Matthew Green
    won't fully vouch: correctness "relies on on-paper analysis that may or may
    not yield an actual runtime improvement." Green independently states the same
    law — exciting recent results carry a "machine-checkable proof" or a "simple
    counterexample you can compute on"; a key recovery IS the counterexample.
    "Flaws in the algorithm itself" oversells: three targets are reduced-round
    variants (7 of 10 AES rounds, 6 of 32 Serpent, 13 of 24 LEA) — the designed
    safety margin measured on purpose, not the wall breached — and Claude's own
    summary is that "none of the ingredients are exotic," i.e. synthesis of known
    tools, not new mathematics. Counter-thesis: what got cheaper is cryptanalytic
    *labour*, not cryptography's security. The scarce input was always
    expert-hours pointed at a specific scheme (Green: "there simply have not been
    enough human beings dedicated to analysing these problems"), so a tireless
    known-toolkit applier is mostly a defender's win — grind every candidate
    before standardisation freezes it; HAWK was caught and pulled from NIST the
    next day, the process working faster. Same distributional frame as the
    autonomous-ransomware dive (the marginal cost of the automatable middle fell;
    volume and targeting shift, not the capability ceiling). The one place with
    real teeth is public-key / post-quantum crypto (few underlying structures,
    under-analysed) — but that is the same asymmetry pointing the same way, since
    key recovery is an executable witness, which is what predicts that PQC bends
    before full-round symmetric ciphers do.
    W32 (contrarian lens): the human skill-distribution corollary. Whether AI
    *levels* or *concentrates* skill is set by the same verifier variable, not by
    AI. The famous "AI democratizes knowledge work" field experiments all measured
    tasks with a cheap, tolerant verifier and a bounded downside: Brynjolfsson,
    Li and Raymond's customer-support study (QJE 2025, 5,179 agents) raised
    productivity 14% on average but 34% for novices and roughly zero for experts,
    "disseminating the best practices of more able workers"; the Harvard–BCG
    "jagged frontier" experiment (Organization Science 2025, 758 consultants)
    lifted below-average performers 43% versus 17% for above-average — inside the
    frontier. Flip to expensive-verifier, silent-costly-error work and the sign
    flips: METR's 2025 RCT (16 expert open-source developers on their own mature
    repositories, 246 issues) found them 19% *slower* with AI, having predicted a
    24% speedup and still believing in a 20% speedup afterward; BCG's own
    outside-frontier task made AI users 19 points less likely to be correct. So
    leveling (cheap verifier → the machine supplies the check → the novice rides
    along) and concentration (expensive verifier → only the expert can supply the
    check) are one mechanism read at two verifier prices — the human-side reading
    of the same asymmetry, and the scarce residual skill, verification, is exactly
    the one that deskills with disuse. It reframes the week's displacement-anxiety
    HN arc: the residual isn't aesthetic *taste*, it's *verification* — spec plus
    error-detection, which is checkable and trainable and has right answers. Prove
    it wrong with a production, brownfield, correctness-critical RCT, stratified by
    skill, showing AI narrowing the junior–senior defect gap as models improve.
    W33 (analyst lens — the software-testing front, non-AI): the same law explains
    why the most-tested code on Earth hid a corruption bug for 16 years. A test
    suite is a runnable verifier; what matters is the SPACE it searches. SQLite's
    16-year WAL-reset race (Tailscale postmortem; fixed in 3.51.3) survived 100%
    MC/DC branch coverage because coverage certifies the code space — a finite
    number of branches — while a data race lives in the schedule space, where the
    number of interleavings is roughly the product of the threads' states and
    explodes. So 100% of branches can exercise almost none of the orderings; the
    metric and the bug are measured in different units. Deterministic simulation
    testing (Antithesis) found it in about 15 minutes because it pairs the cheapest
    invariant ("no committed write is lost") with a scheduler it controls and
    searches orderings against — model/effort + verifier + search, with the search
    over interleavings instead of tokens. The SQLite team managed zero organic
    reproductions in 16 years of expert reading; a scheduler search took an
    afternoon. The verifier existed the whole time; the search didn't. Deciding
    quantity in this domain: the fraction of reachable schedules the suite actually
    explores, not the fraction of lines.
    W34 (contrarian lens — the wet-lab front): the same law decides where AI cracks
    biology. Anthropic's autonomous protein-design campaign (Aug 20) hit 14 of 15
    targets — 1,320 designs to 354 confirmed binders, hit rates 26.7% (Mythos Preview,
    multi-target), 22.6% (Opus 4.8) and 35.1% (Mythos, single-target) against a
    10–15% industry baseline, with minimal human involvement past the prompt. The
    "AI does biology now" read breaks on the verifier: protein binding is the
    cheapest oracle in the life sciences — express the candidate and read a
    dissociation constant on an automated bio-layer-interferometry pipeline
    (Adaptyv/Twist; under 10 nM counts as a hit; roughly three-week turnaround;
    thousands in parallel). The model proposes, the assay judges, keep the 354 that
    bind — a binding measurement is a certificate exactly like a counterexample or a
    passing test. The same week handed over the contrast, unforced: Moderna and
    Merck's personalized mRNA cancer vaccine cleared Phase 3 (INTerpath-001; 1,137
    patients, 2:1; recurrence-free and distant-metastasis-free survival; the first
    Phase 3 for an individualized neoantigen therapy) — the same field at the
    opposite verifier price, where the oracle is "does a real person stay
    cancer-free over years," a trial you cannot parallelize, launched in 2023 on a
    program years deep, and no model compressed it. Counter-thesis: AI's biology
    wins track verifier cost × fidelity, not model intelligence — a cheap, fast,
    faithful oracle (bench assay) yields binder-style leaps; an expensive,
    un-parallelizable oracle (clinical endpoint) leaves AI helping only at the edges
    (choosing the 34 neoantigens; Opus 5 reading raw NMR/LC-MS in ~20 minutes,
    within 0.08 of a hydrogen count and 96.4% vs 96.33% purity). The hype slide is
    "binds in a dish" → "cures disease," two claims separated by the most expensive
    verifier in science. Counters engaged: reading raw instrument data is itself a
    cheap-verifier task (checkable in one pass); the in-silico co-folding step is a
    cheap approximate verifier the wet lab ratifies (~73% of designs still
    discarded); "AI will compress the clinical verifier too" (digital twins,
    surrogate endpoints) swaps a faithful check for a cheap proxy — the Goodhart
    trap, and recurrence-free survival is already a contested surrogate for overall
    survival. So-what: before pointing any generate-and-check loop at a problem, ask
    what the verifier is, what it costs, how fast it returns, and whether it's
    faithful or gameable — the yield is set by which end the check sits on, not by
    the model's benchmark score. Prove it wrong with a de-novo AI-designed molecule
    hitting a Phase 3 endpoint on a model-compressed timeline, or AI binder
    hit-rates holding at 2–3× the baseline on targets with no cheap binding assay.
  issues:
    - { label: "Dive · A Counterexample Checks in One Pass", link: "/reports/deep-dives/2026-07-24-verifier-asymmetry-check-vs-find.html" }
    - { label: "Dive · Claude Didn't Break Cryptography", link: "/reports/deep-dives/2026-07-31-ai-cryptanalysis-labor-not-security.html" }
    - { label: "Dive · AI Levels the Field Where the Errors Are Cheap", link: "/reports/deep-dives/2026-08-09-ai-levels-where-errors-are-cheap.html" }
    - { label: "Dive · SQLite Tests Every Branch", link: "/reports/deep-dives/2026-08-14-sqlite-coverage-missed-the-race.html" }
    - { label: "Dive · Claude Designed a Working Drug This Week", link: "/reports/deep-dives/2026-08-21-ai-biology-is-a-verifier-story.html" }

- slug: labs-go-vertical-silicon
  title: "Labs go vertical / own the silicon"
  momentum: up
  summary: >-
    The deepest layer of the channel war: inference (not training) is now the
    spend, and Nvidia keeps ~70% gross margin on it, so buyers push down the
    hardware stack to claw it back. OpenAI + Broadcom unveiled Jalapeño (Jun 24):
    a custom LLM-inference chip, 9-month design, gigawatt by end-2026, Microsoft
    pre-buying 40%. Precedent: Google's TPU (production 2015, born of the
    data-center-doubling voice-search calc; >90% silicon utilization vs ~30% on a
    GPU; Anthropic runs up to a million of them). Economics: a custom ASIC trades
    flexibility for ~3–5× perf/watt, ~$300–500M NRE recouped under a year at
    scale; Morgan Stanley sees ASICs at 25% of inference by 2026 (from <5% in
    2023); Broadcom is the common arms dealer (TPU/MTIA/Maia/Jalapeño). The fork:
    OpenAI and Google *build*; Anthropic *rents three* (TPU + >1M Trainium2 +
    Nvidia) — multi-silicon as the hardware version of provider-portability. Bear
    case: ASIC inflexibility is a frozen bet the workload is stable; Nvidia's real
    moat is CUDA + NVLink networking, not the GPU; only giants with captive volume
    and their own compiler can play. So-what: token price falls structurally
    (margin transfer, not promo), but the platform keeps the savings.
    W32 (analyst lens): the extreme bottom rung — model-IN-silicon. AMD bought
    Taalas (Aug 6, closing Q4): weights etched into mask-ROM, no HBM, so the memory
    wall is deleted, not scaled. The ladder is GPU (freezes nothing, loads any
    weights in ms) → transformer ASIC / Etched Sohu (freezes the architecture,
    still loads weights from HBM) → Taalas (freezes the exact weights; a new model
    is a ~2-month metal re-spin). All figures self-reported and un-benchmarked
    (HC1 6nm, Llama 8B ~17k tok/s at ~1/10 an H200's power, $0.0075/Mtok, built by
    24 people for $30M). Deciding quantity = release cadence − re-spin time, which
    is negative today — so the frontier can't be etched (it churns faster than it
    cures), and model-in-silicon is the terminal form of commoditization: a chip
    that freezes a model is a bet the model is finished, which only fits the
    small/stable cheapest-adequate tier. The tell is that AMD, a flexible-GPU
    vendor, bought the anti-GPU.
    W35 (builder lens): the vertical move went the *other* direction — up the stack
    into distribution, not down into silicon. Nvidia reportedly agreed to buy Hugging
    Face for ~$12.9B (unconfirmed), extending from the compute it already owns (the
    ~70% margin) into the default artifact store for open weights (>5M repos, 1.5% of
    which carry 99.2% of downloads). Owning both the shovels and the marketplace where
    the maps are handed out is a different position than owning either alone — and it
    sits on the same neutral ground the open-weights export fight is being waged over
    (a court ruled the Anthropic blacklisting illegal the same week). For the builder
    the takeaway is defensive, not strategic: treat the registry like a single-vendor
    dependency and keep the `HF_ENDPOINT`/`revision`-pin escape hatch ready.
    W35 (analyst lens): the memory makers moved on the same wall from the other side.
    At Hot Chips 2026 Samsung showed LPDDR5X-PIM — a multiplier built into each DRAM
    bank, so batch-1 decode (arithmetic intensity ≈1 op/byte, ~0.34% of an H100's
    roofline) runs on bank-internal bandwidth (614 GB/s) instead of the pins (76.8
    GB/s, 8×) — and measured 3.01× tokens/sec on Llama-3.1-8B. Where Taalas (08-08)
    deletes the memory wall by freezing the weights into mask-ROM, PIM attacks it by
    moving the compute into the RAM; both are bets that the value has migrated into the
    memory (52%→63% of AI-chip component spend). The honest bound is the same shape as
    the rest of the thread: PIM only wins the batch-1 GEMV regime datacenters engineer
    away with batching, so it is an edge/local play, and it stays stranded until a JEDEC
    standard (LPDDR6-PIM, near-complete) and an open-source runtime backend target it.
    Deciding quantity = the fraction of inference served batch-1 on-device vs batched in
    a datacenter.
  tension: >-
    The perf-per-watt headline numbers are self-reported with no independent
    benchmarks, and first-gen custom silicon has a long history of slipping dates
    and under-delivering. A chip only pays if you fill it and the workload holds
    still — the whole bet is on volume and stability, and at the frozen extreme
    (Taalas) the bet narrows to a per-model shelf-life measured in weeks.
  issues:
    - { label: "Dive · Nvidia Keeps 70 Cents of Every Dollar", link: "/reports/deep-dives/2026-06-29-why-ai-labs-build-chips.html" }
    - { label: "Dive · AMD Bought a Chip That Takes Two Months", link: "/reports/deep-dives/2026-08-08-model-in-silicon-shelf-life.html" }
    - { label: "Dive · Your Build Depends on huggingface.co", link: "/reports/deep-dives/2026-08-28-your-build-depends-on-huggingface.html" }
    - { label: "Dive · Samsung Moved the Multiplier Into the RAM", link: "/reports/deep-dives/2026-08-29-processing-in-memory-decode-wall.html" }

- slug: corpus-liability
  title: "The training corpus is the moat and the liability"
  momentum: up
  summary: >-
    The consensus "data is the moat" is only half true: the corpus is the moat
    MADE OF the liability, which is why no frontier lab will open, fully license,
    or disclose it. Peg (W34): Anthropic's IPO valuation "hinges on" a 2028
    revenue forecast of $190–200B (Reuters, Aug 15) — a revenue multiple that
    prices the corpus as a pure asset and buries the exposure. But the exposure
    already landed once: Bartz v. Anthropic split cleanly (Alsup, Jun 2025) —
    training on lawfully-acquired books is "exceedingly transformative" fair use,
    but ACQUIRING ≥5M via LibGen + ≥2M via Pirate Library Mirror was not, and
    rather than a damages trial Anthropic settled for ~$1.5B (~$3,000/work,
    ~500,000 works, largest copyright recovery in US history, final approval
    Jul 2026). The transformation defense protects what you did with the data, not
    how you got it. Statutory ceiling is $150k/work willful → 482,460 works × $150k
    ≈ $72B, and 7M+ pirated copies push the theoretical exposure past the company's
    own value. Technical spine: "the model doesn't store the books" is measurably
    false — Carlini's memorization work (arXiv 2202.07646) shows verbatim
    memorization grows log-linear in model capacity, context length, and
    DUPLICATION; GPT-J 6B memorizes ≥1% of The Pile, and shadow-library dumps are
    the most-duplicated (therefore most-regurgitated, therefore highest-liability)
    text there is — which is why labs dedupe as litigation hygiene. So the
    secrecy is legal, not competitive: a work-level manifest is a plaintiff's
    class list (disclosure is discovery), which is also why "open source AI" keeps
    arriving without the data (OSAID's "data information" unmet, 06-16). So-what:
    read ZDR/"we don't train on your data" as a legal control not a courtesy; the
    provenance question is the indemnity's actual scope (08-10), not model quality;
    a lab's silence about its corpus is the shape of the liability.
  tension: >-
    Alsup ALSO handed the labs the ruling that matters — training is fair use, so
    acquisition looks like a one-time, cleanable cost (buy/license going forward
    and the hole closes). Counter: you can't un-train a shipped model, so the
    exposure rides with every weight already earning; and "licensed" is a
    per-medium, per-jurisdiction grind (books ≠ lyrics ≠ news ≠ GPL'd code), so the
    liability amortizes across a decade of separate fights, not a closing entry.
  issues:
    - { label: "Dive · The Moat Is Made of the Thing They Can Never Show You", link: "/reports/deep-dives/2026-08-18-training-data-moat-and-liability.html" }
    - { label: "Dive · The Open Model You're Running Is a Binary, Not a Source", link: "/reports/deep-dives/2026-06-16-open-weights-is-not-open-source.html" }
    - { label: "Dive · Provenance Is the Product", link: "/reports/deep-dives/2026-08-10-provenance-is-the-product.html" }
