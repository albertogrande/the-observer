# Running threads — the publication's open storylines. Mirrors the threads
# section of reports/MEMORY.md so /threads/ and the dashboard can render them
# as a navigable map. The weekly desk updates momentum and appends issue links.
#
# momentum: up (gaining) | steady | down (stalling)
# tension:  optional — evidence cutting against the thread

- slug: ai-goes-public
  title: "AI goes public / the repricing"
  momentum: up
  summary: >-
    Anthropic filed its S-1 (Jun 1, ~$965B, ~$47B run-rate); SpaceX–xAI
    roadshow; OpenAI's confidential S-1 confirmed Jun 8–9 (~$1T target,
    Goldman + Morgan Stanley, listing late 2026). The market now punishes
    deceleration (Broadcom −15%, Nasdaq −4% Jun 5). The AI trade has become a
    macro variable. W25: the economics tightened in the open — OpenAI's leaked
    financials (per Fortune/Ars, unverified) show ~$21B operating loss on ~$13B
    of 2025 revenue; the FT reported enterprises reining in AI spend; Anthropic's
    subscription split (Jun 15) repriced programmatic usage. The frontier is sold
    below cost while a free MIT substitute (GLM-5.2) ships. W28: the *financing
    structure* of the AI trade examined — Nvidia's ~$110B of circular commitments
    (67% of revenue vs Lucent's 24%) revived the telecom-bust analogy, but the
    risk isn't the circle or Nvidia; it's the levered neocloud middle (CoreWeave
    $24.86B debt, interest 25.8% of revenue, 67% one customer). The end-riders are
    solvent (hyperscalers ~$451B OCF); the weak link is whoever can't refinance,
    this cycle's Winstar.
    W30 (contrarian lens): a partial inversion of that "cash-funded, therefore
    safe" reassurance. The debt is being engineered off the exact statement the
    "they can afford it" argument checks. Three mechanisms: a minority-stake SPV/JV
    (Meta's Hyperion — Blue Owl 80% / Meta 20%, ~$27B of senior secured notes due
    2049 on the vehicle, Meta shows a lease; roughly $120B shifted off balance
    sheets in ~18 months per the BIS); the un-commenced operating lease (under ASC
    842 a lease liability is booked only at commencement, so Moody's counts $662B of
    off-balance-sheet future data-center lease obligations across the five
    hyperscalers — about 113% of their combined adjusted debt, i.e. the invisible
    obligations exceed all the visible debt); and the neocloud pass-through, where
    Oracle kept the buildout ON its books and shows the cost (FY26 free cash flow
    −$23.7B, ~$167B debt, S&P cut to BBB− on OpenAI concentration). So Goldman's
    reassuring "capex ≈ 100% of operating cash flow" is computed over the visible
    half. Counter-thesis: the structure MOVES the risk (to private credit and
    insurers — the BIS names refinancing-at-the-vehicle, procyclical-credit, and
    guarantee-activation channels), it doesn't erase it; the right denominator is
    (reported debt + off-B/S leases + JV obligations + guarantees) ÷ OCF, stress-
    tested against an AI-revenue miss. Honest bounds: it's disclosed, not concealed
    (Moody's counted it; the notes are A+ rated) — slow and arguable, not an Enron
    morning — and the risk transfer is partly real. The market is already twitching
    at the edges: hyperscaler bond order-coverage fell 5×→<2× (Feb→Jul), Meta's CDS
    hit a record while its equity sat near highs, spreads still near cycle lows. The
    tell is a clean reported balance sheet with a widening CDS.
  tension: >-
    W24 added a new risk-factor line — a flagship model can be administratively
    switched off overnight (the Fable 5 export ban).
