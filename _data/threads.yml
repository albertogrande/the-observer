    - { label: "Dive · Imaging Your Code Is a Lossy Bet", link: "/reports/deep-dives/2026-07-04-code-as-image-token-tax.html" }
    - { label: "Dive · The List Price Is Per Token", link: "/reports/deep-dives/2026-07-14-tokenizer-real-price-per-file.html" }
    - { label: "Dive · Eleven More Points Cost 172×", link: "/reports/deep-dives/2026-07-18-reasoning-tokens-cost-per-answer.html" }
